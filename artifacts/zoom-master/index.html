<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Biscotto</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/pet.glb" as="fetch" crossorigin />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000000;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #14081c;
        opacity: 1;
        isolation: isolate;
        overflow: hidden;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }
      #splash-screen .splash-sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 214, 140, 0.2), transparent 28%),
          linear-gradient(180deg, #1a1030 0%, #3a2458 28%, #c46a78 62%, #f0b07a 78%, #6d88b0 100%);
      }
      #splash-screen .splash-copy {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: max(54px, calc(env(safe-area-inset-top, 0px) + 36px)) 24px 0;
      }
      #splash-screen .splash-title {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #fff8ee;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #splash-screen .splash-sub {
        margin-top: 14px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1.15;
        color: #fff8ee;
        text-transform: none;
        animation: none;
      }
      #splash-screen .splash-sub span {
        display: block;
        color: #ffe14a;
      }
      #splash-screen .splash-scene {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 62%;
        z-index: 1;
      }
      #splash-screen .splash-scene svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #splash-enter {
        position: relative;
        z-index: 3;
        margin: auto 22px max(22px, env(safe-area-inset-bottom, 0px));
        height: 54px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 248, 238, 0.72);
        background: #120e1c;
        color: #fff8ee;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.16em;
      }
      #splash-retry-btn {
        display: none;
        position: relative;
        z-index: 3;
        margin: 0 auto 18px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.08);
        color: #fff8ee;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="dialog" aria-label="Enter Biscotto">
      <div class="splash-sky"></div>
      <div class="splash-copy">
        <div class="splash-title">BISCOTTO</div>
        <div class="splash-sub">Your pet.<span>Your Crumbs.</span></div>
      </div>
      <div class="splash-scene" aria-hidden="true">
        <svg viewBox="0 0 390 520" preserveAspectRatio="xMidYMax slice">
          <circle cx="300" cy="70" r="28" fill="#ffe7c2" opacity="0.9" />
          <path d="M40 150 L70 90 L86 150 Z" fill="#2a1c3a" opacity="0.55" />
          <path d="M250 170 L286 70 L310 170 Z" fill="#24162f" opacity="0.5" />
          <path d="M300 190 L330 110 L348 190 Z" fill="#1c1228" opacity="0.45" />
          <ellipse cx="195" cy="250" rx="180" ry="36" fill="#f4d7e4" opacity="0.35" />
          <path d="M0 300 C70 250 120 280 170 250 C230 214 280 250 390 220 L390 520 L0 520 Z" fill="#1a1424" />
          <path d="M0 340 C80 300 140 330 200 300 C270 266 320 310 390 280 L390 520 L0 520 Z" fill="#120e18" />
          <g fill="#0c0a12">
            <circle cx="58" cy="318" r="16" />
            <circle cx="118" cy="308" r="18" />
            <circle cx="178" cy="322" r="15" />
            <circle cx="238" cy="306" r="19" />
            <circle cx="304" cy="318" r="16" />
            <rect x="50" y="318" width="16" height="18" />
            <rect x="110" y="308" width="18" height="22" />
            <rect x="170" y="322" width="16" height="16" />
            <rect x="228" y="306" width="20" height="24" />
            <rect x="296" y="318" width="16" height="18" />
          </g>
          <circle cx="70" cy="430" r="4" fill="#c9a6ff" />
          <circle cx="300" cy="450" r="5" fill="#d7b4ff" />
          <circle cx="150" cy="470" r="3" fill="#b48cff" />
        </svg>
      </div>
      <button type="button" id="splash-enter">ENTER</button>
      <button type="button" id="splash-retry-btn">Riprova</button>
    </div>
    <script>
      (function() {
        var SPLASH_SUB = {
          en: "Enter the game",
          it: "Entra in gioco",
          es: "Entra al juego",
          fil: "Pasok sa laro",
          ru: "Войти в игру",
          uk: "Увійти в гру"
        };
        function splashLang() {
          try {
            var saved = localStorage.getItem("zoom-lang");
            if (saved && SPLASH_SUB[saved]) return saved;
          } catch (e) {}
          return "en";
        }
        var splash = document.getElementById("splash-screen");
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var enterBtn = document.getElementById("splash-enter");
        if (enterBtn) enterBtn.onclick = hideSplash;

        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.exitFullscreen) tg.exitFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#000000'); } catch (e) {}
            try { tg.setBackgroundColor('#000000'); } catch (e) {}
            try { tg.setBottomBarColor('#000000'); } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
