<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zoom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/pet.glb" as="fetch" crossorigin />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000000;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #14081c;
        opacity: 1;
        isolation: isolate;
        overflow: hidden;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }
      #splash-screen .splash-sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 214, 140, 0.2), transparent 28%),
          linear-gradient(180deg, #1a1030 0%, #3a2458 28%, #c46a78 62%, #f0b07a 78%, #6d88b0 100%);
      }
      #splash-screen .splash-copy {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: max(54px, calc(env(safe-area-inset-top, 0px) + 36px)) 24px 0;
      }
      #splash-screen .splash-title {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #fff8ee;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #splash-screen .splash-sub {
        margin-top: 14px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1.15;
        color: #fff8ee;
        text-transform: none;
        animation: none;
      }
      #splash-screen .splash-sub span {
        display: block;
        color: #ffe14a;
      }
      #splash-screen .splash-scene {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 62%;
        z-index: 1;
      }
      #splash-screen .splash-scene svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #splash-screen .splash-snow {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        overflow: hidden;
      }
      #splash-screen .splash-snow i {
        position: absolute;
        top: -6px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255,255,255,0.75);
        animation: splashSnow 14s linear infinite;
      }
      #splash-screen .splash-snow i:nth-child(1) { left: 8%; animation-duration: 13s; }
      #splash-screen .splash-snow i:nth-child(2) { left: 22%; animation-duration: 17s; animation-delay: -4s; }
      #splash-screen .splash-snow i:nth-child(3) { left: 37%; animation-duration: 15s; animation-delay: -8s; width: 2px; height: 2px; }
      #splash-screen .splash-snow i:nth-child(4) { left: 51%; animation-duration: 18s; animation-delay: -2s; }
      #splash-screen .splash-snow i:nth-child(5) { left: 66%; animation-duration: 12s; animation-delay: -6s; width: 2px; height: 2px; }
      #splash-screen .splash-snow i:nth-child(6) { left: 80%; animation-duration: 16s; animation-delay: -11s; }
      #splash-screen .splash-snow i:nth-child(7) { left: 92%; animation-duration: 19s; animation-delay: -3s; width: 2px; height: 2px; }
      @keyframes splashSnow {
        from { transform: translateY(-8px); }
        to { transform: translateY(100dvh); }
      }
      #splash-enter {
        position: relative;
        z-index: 3;
        margin: auto 22px max(22px, env(safe-area-inset-bottom, 0px));
        height: 54px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 248, 238, 0.72);
        background: #120e1c;
        color: #fff8ee;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.16em;
      }
      #splash-retry-btn {
        display: none;
        position: relative;
        z-index: 3;
        margin: 0 auto 18px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.08);
        color: #fff8ee;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="dialog" aria-label="Enter Zoom">
      <div class="splash-sky"></div>
      <div class="splash-copy">
        <div class="splash-title">ZOOM</div>
        <div class="splash-sub">One small life.<span>A world that answers.</span></div>
      </div>
      <div class="splash-scene" aria-hidden="true">
        <svg viewBox="0 0 390 520" preserveAspectRatio="xMidYMax slice">
          <circle cx="292" cy="78" r="26" fill="#fff4c4" />
          <circle cx="292" cy="78" r="40" fill="#fff4c4" opacity="0.28" />
          <path d="M-10 250 L70 120 L130 210 L200 70 L270 200 L340 110 L410 230 L410 520 L-10 520 Z" fill="#1f7a48" />
          <path d="M-10 310 L90 190 L170 280 L250 160 L330 270 L410 180 L410 520 L-10 520 Z" fill="#14643a" />
          <path d="M-10 380 L120 300 L220 360 L320 290 L410 340 L410 520 L-10 520 Z" fill="#0c4630" />
          <path d="M0 450 C80 430 160 460 240 440 C310 424 360 448 390 436 L390 520 L0 520 Z" fill="#083526" />
        </svg>
      </div>
      <div class="splash-meter" aria-hidden="true"><span id="splash-meter-fill"></span></div>
      <button type="button" id="splash-enter" disabled>ENTER</button>
      <button type="button" id="splash-retry-btn">Riprova</button>
    </div>
    <script>
      (function() {
        var SPLASH_SUB = {
          en: "Enter the game",
          it: "Entra in gioco",
          es: "Entra al juego",
          fil: "Pasok sa laro",
          ru: "Войти в игру",
          uk: "Увійти в гру"
        };
        function splashLang() {
          try {
            var saved = localStorage.getItem("zoom-lang");
            if (saved && SPLASH_SUB[saved]) return saved;
          } catch (e) {}
          return "en";
        }
        var splash = document.getElementById("splash-screen");
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var enterBtn = document.getElementById("splash-enter");
        var splashReady = false;
        if (enterBtn) {
          enterBtn.onclick = function() {
            if (!splashReady) return;
            hideSplash();
          };
        }
        setTimeout(function() {
          splashReady = true;
          if (!enterBtn) return;
          enterBtn.disabled = false;
          enterBtn.classList.add("is-ready");
        }, 2400);

        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.exitFullscreen) tg.exitFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#000000'); } catch (e) {}
            try { tg.setBackgroundColor('#000000'); } catch (e) {}
            try { tg.setBottomBarColor('#000000'); } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
