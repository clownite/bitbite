<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zoom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/pet.glb" as="fetch" crossorigin />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000000;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #8fd0ff;
        opacity: 1;
        isolation: isolate;
        overflow: hidden;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }
      #splash-screen .splash-sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 74% 16%, rgba(255, 244, 196, 0.45), transparent 22%),
          linear-gradient(180deg, #8fd0ff 0%, #b7e7c5 38%, #7dcea0 68%, #3e9a62 100%);
      }
      #splash-screen .splash-copy {
        position: relative;
        z-index: 4;
        text-align: center;
        padding: max(54px, calc(env(safe-area-inset-top, 0px) + 36px)) 24px 0;
      }
      #splash-screen .splash-title {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #fff8ee;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #splash-screen .splash-sub {
        margin-top: 14px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1.15;
        color: #fff8ee;
        text-transform: none;
        animation: none;
      }
      #splash-screen .splash-sub span {
        display: block;
        color: #083526;
      }
      #splash-flight {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: block;
        pointer-events: none;
      }
      .splash-noel {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(8, 18, 40, 0.2) 0%, rgba(10, 24, 40, 0.05) 36%, rgba(6, 14, 28, 0.32) 100%);
      }
      .splash-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 0 22px max(18px, env(safe-area-inset-bottom, 0px));
      }
      .splash-meter {
        position: relative;
        z-index: 5;
        margin: 0 34px 14px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .splash-meter span {
        display: block;
        height: 100%;
        width: 0;
        background: #ffffff;
        box-shadow: 0 0 8px #ffffff, 0 0 16px rgba(255, 255, 255, 0.95);
        animation: splash-meter 2.4s linear forwards;
      }
      @keyframes splash-meter {
        to { width: 100%; }
      }
      #splash-enter {
        position: relative;
        z-index: 5;
        display: block;
        width: 100%;
        margin: 0;
        height: 54px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 255, 255, 0.72);
        background: #0c3d28;
        color: #fff8ee;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.16em;
      }
      #splash-retry-btn {
        display: none;
        position: relative;
        z-index: 5;
        margin: 0 auto 12px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.08);
        color: #fff8ee;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="dialog" aria-label="Enter Zoom">
      <div class="splash-sky"></div>
      <div class="splash-copy">
        <div class="splash-title">ZOOM</div>
        <div class="splash-sub">One small life.<span>A world that answers.</span></div>
      </div>
      <canvas id="splash-flight" aria-hidden="true"></canvas>
      <!-- NOEL: togli .splash-noel dopo Natale. Il cielo verde resta. -->
      <div class="splash-noel" aria-hidden="true"></div>
      <div class="splash-dock">
        <button type="button" id="splash-retry-btn">Riprova</button>
        <div class="splash-meter" aria-hidden="true"><span id="splash-meter-fill"></span></div>
        <button type="button" id="splash-enter" disabled>ENTER</button>
      </div>
    </div>
    <script>
      (function() {
        var SPLASH_SUB = {
          en: "Enter the game",
          it: "Entra in gioco",
          es: "Entra al juego",
          fil: "Pasok sa laro",
          ru: "Войти в игру",
          uk: "Увійти в гру"
        };
        function splashLang() {
          try {
            var saved = localStorage.getItem("zoom-lang");
            if (saved && SPLASH_SUB[saved]) return saved;
          } catch (e) {}
          return "en";
        }
        var splash = document.getElementById("splash-screen");
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var enterBtn = document.getElementById("splash-enter");
        var splashReady = false;
        function armEnter() {
          if (splashReady) return;
          splashReady = true;
          if (!enterBtn) return;
          enterBtn.disabled = false;
          enterBtn.classList.add("is-ready");
        }
        if (enterBtn) {
          enterBtn.onclick = function() {
            if (!splashReady || enterBtn.disabled) return;
            hideSplash();
          };
        }
        var meter = document.getElementById("splash-meter-fill");
        if (meter) meter.addEventListener("animationend", armEnter);
        setTimeout(armEnter, 2600);
        var SPLASH_COPY = {
          en: ["One small life.", "A world that answers."],
          it: ["Una vita piccola.", "Un mondo che risponde."],
          es: ["Una vida pequeña.", "Un mundo que responde."],
          fil: ["Isang munting buhay.", "Isang mundong sumasagot."],
          ru: ["Одна маленькая жизнь.", "Мир, который отвечает."],
          uk: ["Одне маленьке життя.", "Світ, який відповідає."]
        };
        var sub = document.querySelector(".splash-sub");
        var lines = SPLASH_COPY[splashLang()] || SPLASH_COPY.en;
        if (sub) sub.innerHTML = lines[0] + "<span>" + lines[1] + "</span>";

        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        (function flyOverMountains() {
          var canvas = document.getElementById("splash-flight");
          if (!canvas) return;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          var dpr = 1;
          var layers = [
            { speed: 0.12, tall: 0.32, fill: "#9ed9b0", lit: "rgba(255,255,255,0.28)", snow: false },
            { speed: 0.2, tall: 0.46, fill: "#1f7a48", lit: "rgba(255,255,255,0.16)", snow: false },
            { speed: 0.32, tall: 0.62, fill: "#0c4630", lit: "rgba(255,255,255,0.1)", snow: true }
          ];
          var flakes = [];
          for (var f = 0; f < 64; f++) {
            flakes.push({
              x: Math.random(),
              y: Math.random(),
              r: 0.7 + Math.random() * 1.7,
              v: 0.035 + Math.random() * 0.09,
              drift: (Math.random() - 0.4) * 0.04,
              a: 0.35 + Math.random() * 0.5
            });
          }
          var gusts = [];
          for (var g = 0; g < 8; g++) {
            gusts.push({ x: Math.random(), y: Math.random() * 0.28, len: 12 + Math.random() * 16, v: 0.08 + Math.random() * 0.12 });
          }
          function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            var rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
          }
          function wave(t, scroll, phase) {
            return 0.7
              + 0.22 * Math.sin((t - scroll) * Math.PI * 4 + phase)
              + 0.08 * Math.sin((t - scroll) * Math.PI * 8 + phase * 1.3);
          }
          function drawWall(layer, side, scroll, w, h, bob) {
            var horizon = h * 0.56;
            var n = 36;
            var top = [];
            for (var i = 0; i <= n; i++) {
              var t = i / n;
              var z = Math.pow(t, 0.9);
              var crest = wave(t, scroll * layer.speed, side);
              var x = w * 0.5 + side * w * (0.14 + z * 0.36);
              var foot = horizon + z * (h * 1.05 - horizon) + bob * z;
              var peak = h * layer.tall * crest * (0.34 + z * 0.85);
              top.push({ x: x, y: foot - peak, crest: crest });
            }
            var edge = side < 0 ? -40 : w + 40;
            ctx.beginPath();
            ctx.moveTo(edge, h + 60);
            for (var p = 0; p < top.length; p++) ctx.lineTo(top[p].x, top[p].y);
            ctx.lineTo(edge, h + 60);
            ctx.closePath();
            ctx.fillStyle = layer.fill;
            ctx.fill();
            if (!layer.snow) return;
            ctx.beginPath();
            ctx.moveTo(top[0].x, top[0].y);
            for (var a = 1; a < top.length; a++) ctx.lineTo(top[a].x, top[a].y);
            ctx.strokeStyle = "rgba(255,252,248,0.88)";
            ctx.lineWidth = 3;
            ctx.lineJoin = "round";
            ctx.stroke();
            for (var c = 1; c < top.length - 1; c++) {
              if (top[c].crest < top[c - 1].crest || top[c].crest < top[c + 1].crest || top[c].crest < 0.9) continue;
              var tip = top[c];
              ctx.beginPath();
              ctx.moveTo(tip.x, tip.y - 8);
              ctx.lineTo(tip.x + 11, tip.y + 6);
              ctx.lineTo(tip.x - 11, tip.y + 6);
              ctx.closePath();
              ctx.fillStyle = "rgba(255,252,248,0.95)";
              ctx.fill();
            }
          }
          resize();
          window.addEventListener("resize", resize);
          var last = performance.now();
          var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          function frame(now) {
            if (!document.getElementById("splash-screen")) return;
            var rect = canvas.getBoundingClientRect();
            if (Math.round(rect.width * dpr) !== canvas.width || Math.round(rect.height * dpr) !== canvas.height) resize();
            var dt = still ? 0 : Math.min(0.034, (now - last) / 1000);
            last = now;
            var w = canvas.width / dpr;
            var h = canvas.height / dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            var bob = still ? 0 : Math.sin(now / 1400) * 4;
            for (var layerIndex = 0; layerIndex < layers.length; layerIndex++) {
              drawWall(layers[layerIndex], -1, now / 1000, w, h, bob);
              drawWall(layers[layerIndex], 1, now / 1000, w, h, bob);
            }
            for (var s = 0; s < gusts.length; s++) {
              var gust = gusts[s];
              gust.x += dt * gust.v;
              if (gust.x > 1.15) gust.x = -0.15;
              ctx.strokeStyle = "rgba(255,255,255,0.28)";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(gust.x * w, gust.y * h);
              ctx.lineTo(gust.x * w - gust.len, gust.y * h - 2);
              ctx.stroke();
            }
            for (var flakeIndex = 0; flakeIndex < flakes.length; flakeIndex++) {
              var flake = flakes[flakeIndex];
              flake.y += dt * flake.v;
              flake.x += dt * flake.drift + Math.sin(now / 700 + flakeIndex) * dt * 0.02;
              if (flake.y > 1.04) {
                flake.y = -0.02;
                flake.x = Math.random();
              }
              if (flake.x < -0.05) flake.x = 1.02;
              if (flake.x > 1.05) flake.x = -0.02;
              ctx.beginPath();
              ctx.fillStyle = "rgba(255,255,255," + flake.a + ")";
              ctx.arc(flake.x * w, flake.y * h, flake.r, 0, Math.PI * 2);
              ctx.fill();
            }
            if (!still) requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        })();

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.exitFullscreen) tg.exitFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#000000'); } catch (e) {}
            try { tg.setBackgroundColor('#000000'); } catch (e) {}
            try { tg.setBottomBarColor('#000000'); } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
