<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zoom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/pet.glb" as="fetch" crossorigin />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000000;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #000000;
        opacity: 1;
        isolation: isolate;
        overflow: hidden;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }
      #splash-screen .splash-sky {
        position: absolute;
        inset: 0;
        background: #000000;
      }
      #splash-screen .splash-copy {
        position: relative;
        z-index: 4;
        text-align: center;
        margin-top: -8vh;
        padding: 0 24px;
      }
      .splash-in {
        opacity: 0;
        animation: splash-in 0.7s ease forwards;
      }
      @keyframes splash-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .splash-title {
        position: relative;
        display: inline-block;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .splash-m { position: relative; }
      #splash-gift {
        position: absolute;
        width: 34px;
        height: 34px;
        left: 6px;
        top: -20px;
        transform: rotate(16deg);
        image-rendering: pixelated;
        pointer-events: none;
      }
      #splash-screen,
      #splash-screen * {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #splash-screen .splash-title {
        margin: 0;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #fff8ee;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #splash-screen .splash-sub {
        margin-top: 14px;
        font-size: 28px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1.15;
        color: #fff8ee;
        text-transform: none;
        animation: none;
      }
      #splash-screen .splash-sub span {
        display: block;
        color: #fff8ee;
      }
      #splash-screen .splash-line {
        display: block;
      }
      #splash-snow {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: block;
        pointer-events: none;
      }
      .splash-noel {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(8, 18, 40, 0.2) 0%, rgba(10, 24, 40, 0.05) 36%, rgba(6, 14, 28, 0.32) 100%);
      }
      .splash-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 0 22px max(18px, env(safe-area-inset-bottom, 0px));
      }
      .splash-meter {
        position: relative;
        z-index: 5;
        margin: 0 34px 14px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .splash-meter span {
        display: block;
        height: 100%;
        width: 0;
        background: #ffffff;
        box-shadow: 0 0 8px #ffffff, 0 0 16px rgba(255, 255, 255, 0.95);
        animation: splash-meter 2.4s linear forwards;
      }
      @keyframes splash-meter {
        to { width: 100%; }
      }
      #splash-enter {
        position: relative;
        z-index: 5;
        display: block;
        width: 76px;
        height: 76px;
        margin: 0 auto;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        cursor: pointer;
      }
      #splash-cookie {
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
      }
      .splash-bit {
        position: fixed;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
        z-index: 2147483647;
      }
      #splash-retry-btn {
        display: none;
        position: relative;
        z-index: 5;
        margin: 0 auto 12px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.08);
        color: #fff8ee;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="dialog" aria-label="Enter Zoom">
      <div class="splash-sky"></div>
      <div class="splash-copy">
        <div class="splash-title splash-in" style="animation-delay: 0.15s">ZOO<span class="splash-m">M<canvas id="splash-gift" width="16" height="16" aria-hidden="true"></canvas></span></div>
        <div class="splash-sub">
          <span class="splash-line splash-in" id="splash-line-0" style="animation-delay: 0.95s">One small life.</span>
          <span class="splash-line splash-in" id="splash-line-1" style="animation-delay: 1.2s">A world that answers.</span>
        </div>
      </div>
      <!-- NOEL: la neve. Toglila dopo Natale. Lo sfondo nero resta. -->
      <canvas id="splash-snow" aria-hidden="true"></canvas>
      <div class="splash-dock">
        <button type="button" id="splash-retry-btn">Riprova</button>
        <div class="splash-meter" aria-hidden="true"><span id="splash-meter-fill"></span></div>
        <button type="button" id="splash-enter" disabled aria-label="Enter"><canvas id="splash-cookie" width="11" height="11"></canvas></button>
      </div>
    </div>
    <script>
      (function() {
        var SPLASH_SUB = {
          en: "Enter the game",
          it: "Entra in gioco",
          es: "Entra al juego",
          fil: "Pasok sa laro",
          ru: "Войти в игру",
          uk: "Увійти в гру"
        };
        function splashLang() {
          try {
            var saved = localStorage.getItem("zoom-lang");
            if (saved && SPLASH_SUB[saved]) return saved;
          } catch (e) {}
          return "en";
        }
        var splash = document.getElementById("splash-screen");
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var enterBtn = document.getElementById("splash-enter");
        var splashReady = false;
        function armEnter() {
          if (splashReady) return;
          splashReady = true;
          if (!enterBtn) return;
          enterBtn.disabled = false;
          enterBtn.classList.add("is-ready");
        }
        function paintCookie(canvas) {
          var src = document.createElement("canvas");
          src.width = 64;
          src.height = 64;
          var sctx = src.getContext("2d");
          if (!sctx) return;
          sctx.font = "54px \"Apple Color Emoji\", \"Segoe UI Emoji\", \"Noto Color Emoji\", sans-serif";
          sctx.textAlign = "center";
          sctx.textBaseline = "middle";
          sctx.fillText("🍪", 32, 36);
          var pixels = sctx.getImageData(0, 0, 64, 64).data;
          var minX = 64, minY = 64, maxX = 0, maxY = 0, seen = false;
          for (var y = 0; y < 64; y++) {
            for (var x = 0; x < 64; x++) {
              if (pixels[(y * 64 + x) * 4 + 3] < 20) continue;
              seen = true;
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          ctx.imageSmoothingEnabled = false;
          if (!seen) {
            var dough = ["..#####..", ".#######.", "########.", "###o####.", "########.", "####o###.", ".######o.", ".##o####.", "..#####.."];
            canvas.width = 9;
            canvas.height = 9;
            dough.forEach(function (row, yy) {
              row.split("").forEach(function (bit, xx) {
                if (bit === ".") return;
                ctx.fillStyle = bit === "o" ? "#5c3317" : "#e0a84a";
                ctx.fillRect(xx, yy, 1, 1);
              });
            });
            return;
          }
          var cols = 11;
          var rows = Math.max(11, Math.round(((maxY - minY + 1) / (maxX - minX + 1)) * cols));
          canvas.width = cols;
          canvas.height = rows;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(src, minX, minY, maxX - minX + 1, maxY - minY + 1, 0, 0, cols, rows);
        }
        var cookie = document.getElementById("splash-cookie");
        if (cookie) paintCookie(cookie);
        function breakCookie() {
          if (!cookie) return;
          var box = cookie.getBoundingClientRect();
          var sw = cookie.width;
          var sh = cookie.height;
          var cuts = [
            { x: 0, y: 0, dx: -52, dy: -78, rot: -32 },
            { x: 1, y: 0, dx: 56, dy: -70, rot: 28 },
            { x: 0, y: 1, dx: -40, dy: -30, rot: 22 },
            { x: 1, y: 1, dx: 44, dy: -24, rot: -20 }
          ];
          cookie.style.visibility = "hidden";
          cuts.forEach(function (cut) {
            var pw = Math.ceil(sw / 2);
            var ph = Math.ceil(sh / 2);
            var bit = document.createElement("canvas");
            bit.width = pw;
            bit.height = ph;
            bit.className = "splash-bit";
            var bctx = bit.getContext("2d");
            if (bctx) {
              bctx.imageSmoothingEnabled = false;
              bctx.drawImage(cookie, cut.x * Math.floor(sw / 2), cut.y * Math.floor(sh / 2), pw, ph, 0, 0, pw, ph);
            }
            bit.style.left = (box.left + cut.x * box.width / 2) + "px";
            bit.style.top = (box.top + cut.y * box.height / 2) + "px";
            bit.style.width = (box.width / 2) + "px";
            bit.style.height = (box.height / 2) + "px";
            document.body.appendChild(bit);
            bit.animate([
              { transform: "translate(0px, 0px) rotate(0deg)", opacity: 1 },
              { transform: "translate(" + cut.dx + "px, " + cut.dy + "px) rotate(" + cut.rot + "deg)", opacity: 0 }
            ], { duration: 460, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" });
            setTimeout(function () { bit.remove(); }, 480);
          });
        }
        if (enterBtn) {
          enterBtn.onclick = function() {
            if (!splashReady || enterBtn.disabled || enterBtn.dataset.broke) return;
            enterBtn.dataset.broke = "1";
            enterBtn.disabled = true;
            breakCookie();
            setTimeout(hideSplash, 420);
          };
        }
        var meter = document.getElementById("splash-meter-fill");
        if (meter) meter.addEventListener("animationend", armEnter);
        setTimeout(armEnter, 2600);
        var SPLASH_COPY = {
          en: ["One small life.", "A world that answers."],
          it: ["Una vita piccola.", "Un mondo che risponde."],
          es: ["Una vida pequeña.", "Un mundo que responde."],
          fil: ["Isang munting buhay.", "Isang mundong sumasagot."],
          ru: ["Одна маленькая жизнь.", "Мир, который отвечает."],
          uk: ["Одне маленьке життя.", "Світ, який відповідає."]
        };
        var lines = SPLASH_COPY[splashLang()] || SPLASH_COPY.en;
        var line0 = document.getElementById("splash-line-0");
        var line1 = document.getElementById("splash-line-1");
        if (line0) line0.textContent = lines[0];
        if (line1) line1.textContent = lines[1];

        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        (function snowAndGift() {
          var gift = document.getElementById("splash-gift");
          if (gift) {
            var g = gift.getContext("2d");
            if (g) {
              var ink = {
                r: "#e23b4a",
                w: "#ffd0d6",
                d: "#8e1830",
                g: "#f6d56a",
                h: "#fff3c4",
                b: "#d4263c",
                s: "#9a1830",
                l: "#ff6d7c"
              };
              var pix = [
                "....rr....rr....",
                "...rwwr..rwwr...",
                "..rd.rrrr.dr....",
                "...rrrrrrrrr....",
                "....rrggrr......",
                ".....rgggr......",
                "..llllllllllll..",
                ".lbbbbbbbbbbbbl.",
                ".bbbbbbggbbbbbb.",
                ".bbbbbbggbbbbbb.",
                ".bbbggggggggbbb.",
                ".bbbbhhggbbbbbb.",
                ".bbbbbbggbbbbbb.",
                ".sbbbbbbbbbbbbs.",
                "..ssssssssssss..",
                "................"
              ];
              pix.forEach(function (row, y) {
                row.split("").forEach(function (bit, x) {
                  if (!ink[bit]) return;
                  g.fillStyle = ink[bit];
                  g.fillRect(x, y, 1, 1);
                });
              });
            }
          }
          var canvas = document.getElementById("splash-snow");
          if (!canvas) return;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          var dpr = 1;
          var flakes = [];
          for (var i = 0; i < 90; i++) {
            flakes.push({
              x: Math.random(),
              y: Math.random(),
              r: 0.8 + Math.random() * 2.2,
              v: 0.03 + Math.random() * 0.1,
              drift: (Math.random() - 0.5) * 0.03,
              a: 0.45 + Math.random() * 0.5
            });
          }
          function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            var rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
          }
          resize();
          window.addEventListener("resize", resize);
          var last = performance.now();
          function frame(now) {
            if (!document.getElementById("splash-screen")) return;
            var rect = canvas.getBoundingClientRect();
            if (Math.round(rect.width * dpr) !== canvas.width) resize();
            var dt = Math.min(0.034, (now - last) / 1000);
            last = now;
            var w = canvas.width / dpr;
            var h = canvas.height / dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            for (var n = 0; n < flakes.length; n++) {
              var flake = flakes[n];
              flake.y += dt * flake.v;
              flake.x += dt * flake.drift + Math.sin(now / 900 + n) * dt * 0.015;
              if (flake.y > 1.05) { flake.y = -0.02; flake.x = Math.random(); }
              ctx.beginPath();
              ctx.fillStyle = "rgba(255,255,255," + flake.a + ")";
              ctx.arc(flake.x * w, flake.y * h, flake.r, 0, Math.PI * 2);
              ctx.fill();
            }
            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        })();

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.exitFullscreen) tg.exitFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#000000'); } catch (e) {}
            try { tg.setBackgroundColor('#000000'); } catch (e) {}
            try { tg.setBottomBarColor('#000000'); } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
