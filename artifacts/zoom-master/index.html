<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>BitBite</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #8d976c;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 2147483647;
        box-sizing: border-box;
        height: var(--tg-viewport-stable-height, 100dvh);
        max-height: 100dvh;
        padding-top: calc(max(var(--tg-safe-area-inset-top, 0px), env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
        background: #8d976c;
        overflow: hidden;
      }
      #splash-screen.hidden { display: none !important; }
      .gb-boot {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #8d976c;
        border: 8px solid #10140c;
        border-radius: 18px 18px 22px 22px;
        box-shadow: inset 0 0 0 2px #d7dec4, inset 0 0 0 6px #5e664e;
        overflow: hidden;
      }
      .gb-boot-top {
        height: 22px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 5px;
        padding: 0 16px;
      }
      .gb-boot-top i { width: 10px; height: 10px; background: #9a3b3b; }
      .gb-boot-top i:nth-child(2) { background: #c4b15a; }
      .gb-boot-top i:nth-child(3) { background: #3d6b3a; }
      .gb-boot-lcd {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 6px 16px 8px;
        display: flex;
        flex-direction: column;
        background: #9bbc0f;
        border: 9px solid #12160e;
        border-radius: 12px;
        box-shadow: inset 0 0 0 3px #2a3422, 0 0 0 4px #8d976c, 0 14px 22px rgba(12, 16, 8, 0.28);
        overflow: hidden;
      }
      .gb-boot-stage {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        filter: drop-shadow(4px 6px 0 rgba(15, 56, 15, 0.28));
      }
      .gb-boot-nav {
        height: 46px;
        margin: 2px 4px 2px;
        flex-shrink: 0;
        border-top: 3px solid #10260e;
      }
      .gb-boot-lcd::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(180deg, transparent 0 2px, rgba(15, 56, 15, 0.06) 2px 3px);
      }
      #splash-word {
        position: relative;
        z-index: 1;
        width: 232px;
        height: 40px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .gb-load-track {
        position: relative;
        z-index: 1;
        width: 168px;
        height: 14px;
        box-sizing: border-box;
        padding: 2px;
        border: 3px solid #0f380f;
        background: #8bac0f;
      }
      .gb-load-track i {
        display: block;
        height: 100%;
        width: 0;
        background: #0f380f;
        box-shadow: 6px 0 0 rgba(15, 56, 15, 0.18);
        animation: gb-load 3s linear forwards;
      }
      @keyframes gb-load { to { width: 100%; } }
      .boot-snow { position: absolute; inset: 0; z-index: 4; overflow: hidden; pointer-events: none; }
      .boot-snow i {
        position: absolute;
        top: 0;
        color: rgba(255, 255, 255, 0.82);
        font-style: normal;
        line-height: 1;
        text-shadow: 0 1px 0 rgba(15, 56, 15, 0.25), 0 0 8px rgba(255, 255, 255, 0.5);
        animation: boot-fall linear infinite;
      }
      @keyframes boot-fall {
        from { transform: translate3d(0, -8dvh, 0); }
        to { transform: translate3d(var(--drift), 108dvh, 0); }
      }
      .gb-boot-console { position: relative; height: 118px; flex-shrink: 0; }
      .gb-boot-dpad { position: absolute; left: 16px; top: 4px; width: 78px; height: 78px; }
      .gb-boot-dpad i, .gb-boot-dpad b {
        position: absolute;
        background: linear-gradient(160deg, #5a5a5a, #1c1c1c 55%, #111);
        box-shadow: inset 2px 2px 0 #7a7a7a, inset -2px -3px 0 #0a0a0a, 0 3px 0 #111;
        border-radius: 4px;
      }
      .gb-boot-dpad i:first-child { left: 28px; top: 0; width: 22px; height: 78px; }
      .gb-boot-dpad i:nth-child(2) { left: 0; top: 28px; width: 78px; height: 22px; }
      .gb-boot-dpad b { left: 28px; top: 28px; width: 22px; height: 22px; border-radius: 50%; background: #1a1a1a; }
      .gb-boot-pills { position: absolute; left: 50%; bottom: 8px; display: flex; gap: 12px; transform: translateX(-50%); }
      .gb-boot-pills i { width: 28px; height: 10px; border-radius: 8px; background: #1c1c1c; box-shadow: inset 1px 1px 0 #666; transform: rotate(-28deg); }
      .gb-boot-face { position: absolute; right: 12px; top: 2px; width: 112px; height: 92px; }
      .gb-boot-a, .gb-boot-b { position: absolute; border-radius: 50%; }
      .gb-boot-a { right: 0; top: 0; width: 50px; height: 50px; background: radial-gradient(circle at 34% 30%, #5ec46a, #1f7a32 58%, #0d4a18); box-shadow: inset 2px 2px 0 #b6f0a8, 0 4px 0 #06240c; }
      .gb-boot-b { left: 6px; bottom: 0; width: 38px; height: 38px; background: radial-gradient(circle at 34% 30%, #e07078, #9a2834 58%, #5c121c); box-shadow: inset 2px 2px 0 #ffc0c0, 0 3px 0 #3a1014; }
      .gb-boot-speaker { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 4px; transform: rotate(32deg); }
      .gb-boot-speaker i { width: 3px; height: 16px; border-radius: 2px; background: #3e4630; }
      #splash-retry-btn {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 132px;
        z-index: 5;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 3px solid #0f380f;
        background: #c6e35a;
        color: #0f380f;
        font-family: ui-monospace, monospace;
        font-weight: 700;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="status" aria-label="Loading">
      <div class="gb-boot">
        <div class="gb-boot-top" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="gb-boot-lcd">
          <div class="gb-boot-stage">
            <canvas id="splash-word" width="116" height="20" aria-label="Loading"></canvas>
            <div class="gb-load-track" aria-hidden="true"><i id="splash-meter-fill"></i></div>
          </div>
          <div class="gb-boot-nav" aria-hidden="true"></div>
        </div>
        <div class="gb-boot-console" aria-hidden="true">
          <div class="gb-boot-dpad"><i></i><i></i><b></b></div>
          <div class="gb-boot-pills"><i></i><i></i></div>
          <div class="gb-boot-face"><b class="gb-boot-b"></b><b class="gb-boot-a"></b></div>
          <div class="gb-boot-speaker"><i></i><i></i><i></i></div>
        </div>
        <div class="boot-snow" aria-hidden="true">
          <i style="left:6%;font-size:13px;animation-duration:16s;animation-delay:-2s;--drift:12px">❄</i>
          <i style="left:16%;font-size:10px;animation-duration:19s;animation-delay:-9s;--drift:-16px">❄</i>
          <i style="left:27%;font-size:15px;animation-duration:17s;animation-delay:-14s;--drift:18px">❄</i>
          <i style="left:38%;font-size:11px;animation-duration:21s;animation-delay:-5s;--drift:-10px">❄</i>
          <i style="left:48%;font-size:14px;animation-duration:18s;animation-delay:-12s;--drift:14px">❄</i>
          <i style="left:58%;font-size:10px;animation-duration:22s;animation-delay:-3s;--drift:-20px">❄</i>
          <i style="left:67%;font-size:16px;animation-duration:15s;animation-delay:-8s;--drift:8px">❄</i>
          <i style="left:76%;font-size:12px;animation-duration:20s;animation-delay:-16s;--drift:-14px">❄</i>
          <i style="left:86%;font-size:14px;animation-duration:17s;animation-delay:-6s;--drift:16px">❄</i>
          <i style="left:93%;font-size:11px;animation-duration:23s;animation-delay:-11s;--drift:-8px">❄</i>
        </div>
      </div>
      <button type="button" id="splash-retry-btn">Riprova</button>
    </div>
    <script>
      (function() {
        var splash = document.getElementById("splash-screen");
        window.__zoomWantMusic = true;
        try {
          if (localStorage.getItem("zoom-bgm-muted") !== "1") {
            var bootSong = new Audio("/audio/lonely-cherry-tree.mp3");
            bootSong.loop = true;
            bootSong.preload = "auto";
            bootSong.volume = 0.5;
            bootSong.setAttribute("playsinline", "true");
            window.__bitbiteSong = bootSong;
            var started = bootSong.play();
            if (started && started.catch) started.catch(function () {});
            var nudge = function () {
              if (bootSong.paused) {
                var again = bootSong.play();
                if (again && again.catch) again.catch(function () {});
              }
            };
            window.addEventListener("pointerdown", nudge, true);
            window.addEventListener("touchstart", nudge, true);
          }
        } catch (e) {}
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var GLYPH = {
          L: ["#...", "#...", "#...", "#...", "#...", "#...", "####"],
          O: [".##.", "#..#", "#..#", "#..#", "#..#", "#..#", ".##."],
          A: [".##.", "#..#", "#..#", "####", "#..#", "#..#", "#..#"],
          D: ["###.", "#..#", "#..#", "#..#", "#..#", "#..#", "###."],
          I: ["###", ".#.", ".#.", ".#.", ".#.", ".#.", "###"],
          N: ["#..#", "##.#", "##.#", "#.##", "#.##", "#..#", "#..#"],
          G: [".##.", "#..#", "#...", "#.##", "#..#", "#..#", ".###"]
        };
        (function drawLoading() {
          var canvas = document.getElementById("splash-word");
          if (!canvas) return;
          var word = "LOADING";
          var rows = 7;
          var gap = 1;
          var width = 0;
          for (var n = 0; n < word.length; n++) width += GLYPH[word[n]][0].length + (n ? gap : 0);
          canvas.width = width;
          canvas.height = rows;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          ctx.fillStyle = "#0f380f";
          var x0 = 0;
          for (n = 0; n < word.length; n++) {
            var rowsOf = GLYPH[word[n]];
            for (var y = 0; y < rowsOf.length; y++) {
              for (var x = 0; x < rowsOf[y].length; x++) {
                if (rowsOf[y][x] === "#") ctx.fillRect(x0 + x, y, 1, 1);
              }
            }
            x0 += rowsOf[0].length + gap;
          }
        })();
        var barDone = false;
        function gameReady() {
          var root = document.getElementById("root");
          return !!(root && (root.querySelector(".gb-app") || root.querySelector(".zoom-splash-screen")));
        }
        function tryEnter() {
          if (!barDone || splashHidden || !gameReady()) return;
          hideSplash();
        }
        function arm() {
          barDone = true;
          window.__zoomCookieTapped = true;
          tryEnter();
        }
        var meter = document.getElementById("splash-meter-fill");
        if (meter) meter.addEventListener("animationend", arm);
        setTimeout(arm, 3000);
        setInterval(tryEnter, 80);
        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#8d976c'); } catch (e) {}
            try { tg.setBackgroundColor('#8d976c'); } catch (e) {}
            try { tg.setBottomBarColor('#8d976c'); } catch (e) {}
            try {
              var keepSwipe = function () { try { tg.enableVerticalSwipes && tg.enableVerticalSwipes(); } catch (e) {} };
              tg.onEvent && tg.onEvent('fullscreenChanged', keepSwipe);
              tg.onEvent && tg.onEvent('fullscreenFailed', keepSwipe);
              tg.onEvent && tg.onEvent('viewportChanged', keepSwipe);
            } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
