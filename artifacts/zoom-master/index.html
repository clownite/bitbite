<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zoom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/pet.glb" as="fetch" crossorigin />
    <!-- Non-blocking fonts — never delay first paint / JS boot -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" /></noscript>
    <!-- Telegram SDK: defer so HTML splash + app bundle start immediately -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000000;
        min-height: 100%;
      }
      body.zoom-splash-on #root {
        visibility: hidden !important;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #8fd0ff;
        opacity: 1;
        isolation: isolate;
        overflow: hidden;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
        display: none !important;
      }
      #splash-screen .splash-sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 74% 16%, rgba(255, 244, 196, 0.45), transparent 22%),
          linear-gradient(180deg, #8fd0ff 0%, #b7e7c5 38%, #7dcea0 68%, #3e9a62 100%);
      }
      #splash-screen .splash-copy {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: max(54px, calc(env(safe-area-inset-top, 0px) + 36px)) 24px 0;
      }
      #splash-screen .splash-title {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 0.08em;
        color: #fff8ee;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #splash-screen .splash-sub {
        margin-top: 14px;
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0;
        line-height: 1.15;
        color: #fff8ee;
        text-transform: none;
        animation: none;
      }
      #splash-screen .splash-sub span {
        display: block;
        color: #083526;
      }
      #splash-flight {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: block;
        pointer-events: none;
      }
      .splash-meter {
        position: relative;
        z-index: 3;
        margin: auto 56px 12px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .splash-meter span {
        display: block;
        height: 100%;
        width: 0;
        background: #ffffff;
        box-shadow: 0 0 8px #ffffff, 0 0 16px rgba(255, 255, 255, 0.95);
        animation: splash-meter 2.4s linear forwards;
      }
      @keyframes splash-meter {
        to { width: 100%; }
      }
      #splash-enter {
        position: relative;
        z-index: 3;
        margin: auto 22px max(22px, env(safe-area-inset-bottom, 0px));
        height: 54px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 255, 255, 0.72);
        background: #0c3d28;
        color: #fff8ee;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.16em;
      }
      #splash-retry-btn {
        display: none;
        position: relative;
        z-index: 3;
        margin: 0 auto 18px;
        padding: 12px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.08);
        color: #fff8ee;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body class="zoom-splash-on">
    <div id="splash-screen" role="dialog" aria-label="Enter Zoom">
      <div class="splash-sky"></div>
      <div class="splash-copy">
        <div class="splash-title">ZOOM</div>
        <div class="splash-sub">One small life.<span>A world that answers.</span></div>
      </div>
      <canvas id="splash-flight" aria-hidden="true"></canvas>
      <div class="splash-meter" aria-hidden="true"><span id="splash-meter-fill"></span></div>
      <button type="button" id="splash-enter" disabled>ENTER</button>
      <button type="button" id="splash-retry-btn">Riprova</button>
    </div>
    <script>
      (function() {
        var SPLASH_SUB = {
          en: "Enter the game",
          it: "Entra in gioco",
          es: "Entra al juego",
          fil: "Pasok sa laro",
          ru: "Войти в игру",
          uk: "Увійти в гру"
        };
        function splashLang() {
          try {
            var saved = localStorage.getItem("zoom-lang");
            if (saved && SPLASH_SUB[saved]) return saved;
          } catch (e) {}
          return "en";
        }
        var splash = document.getElementById("splash-screen");
        window.__zoomSplashStart = performance.now();
        var splashHidden = false;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          window.__zoomSplashFinished = true;
          try { document.body.classList.remove("zoom-splash-on"); } catch (e) {}
          if (!splash) return;
          splash.classList.add("hidden");
          splash.style.display = "none";
          try { splash.remove(); } catch (e) {}
        }
        window.__hideHtmlSplash = hideSplash;

        var enterBtn = document.getElementById("splash-enter");
        var splashReady = false;
        function armEnter() {
          if (splashReady) return;
          splashReady = true;
          if (!enterBtn) return;
          enterBtn.disabled = false;
          enterBtn.classList.add("is-ready");
        }
        if (enterBtn) {
          enterBtn.onclick = function() {
            if (!splashReady || enterBtn.disabled) return;
            hideSplash();
          };
        }
        var meter = document.getElementById("splash-meter-fill");
        if (meter) meter.addEventListener("animationend", armEnter);
        setTimeout(armEnter, 2600);
        var SPLASH_COPY = {
          en: ["One small life.", "A world that answers."],
          it: ["Una vita piccola.", "Un mondo che risponde."],
          es: ["Una vida pequeña.", "Un mundo que responde."],
          fil: ["Isang munting buhay.", "Isang mundong sumasagot."],
          ru: ["Одна маленькая жизнь.", "Мир, который отвечает."],
          uk: ["Одне маленьке життя.", "Світ, який відповідає."]
        };
        var sub = document.querySelector(".splash-sub");
        var lines = SPLASH_COPY[splashLang()] || SPLASH_COPY.en;
        if (sub) sub.innerHTML = lines[0] + "<span>" + lines[1] + "</span>";

        setTimeout(function() {
          if (!window.__zoomReactBooted) {
            var btn = document.getElementById("splash-retry-btn");
            if (btn) btn.style.display = "inline-block";
          }
        }, 8000);

        function applySplashSubtitle() { /**/ }

        (function flyOverMountains() {
          var canvas = document.getElementById("splash-flight");
          if (!canvas) return;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          var dpr = 1;
          var peaks = [];
          var gusts = [];
          function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            var rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
          }
          function makePeak(z) {
            return {
              z: z,
              x: Math.random() * 1.2 - 0.1,
              h: 0.82 + Math.random() * 0.18,
              w: 0.9 + Math.random() * 0.55,
              lean: Math.random() * 0.06 - 0.03
            };
          }
          for (var i = 0; i < 7; i++) peaks.push(makePeak(i / 7));
          function makeGust() {
            return {
              x: Math.random() * 1.4 - 0.2,
              y: Math.random(),
              len: 22 + Math.random() * 70,
              v: 0.18 + Math.random() * 0.55,
              a: 0.16 + Math.random() * 0.28
            };
          }
          for (var g = 0; g < 16; g++) gusts.push(makeGust());
          function mix(z) {
            var stops = [[143, 214, 164], [46, 150, 96], [12, 70, 48], [8, 53, 38]];
            var t = Math.max(0, Math.min(0.999, z));
            var scaled = t * (stops.length - 1);
            var index = Math.floor(scaled);
            var k = scaled - index;
            var p = stops[index];
            var q = stops[index + 1];
            return [
              Math.round(p[0] + (q[0] - p[0]) * k),
              Math.round(p[1] + (q[1] - p[1]) * k),
              Math.round(p[2] + (q[2] - p[2]) * k)
            ];
          }
          resize();
          window.addEventListener("resize", resize);
          var last = performance.now();
          var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          function frame(now) {
            if (!document.getElementById("splash-screen")) return;
            var rect = canvas.getBoundingClientRect();
            if (Math.round(rect.width * dpr) !== canvas.width || Math.round(rect.height * dpr) !== canvas.height) resize();
            var dt = still ? 0 : Math.min(0.034, (now - last) / 1000);
            last = now;
            var w = canvas.width / dpr;
            var h = canvas.height / dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
              var horizon = h * 0.5;
            var bob = still ? 0 : Math.sin(now / 1100) * 5;
            peaks.sort(function (a, b) { return a.z - b.z; });
            for (var n = 0; n < peaks.length; n++) {
              var m = peaks[n];
              m.z += dt * (0.055 + m.z * 0.34);
              if (m.z > 1.18) {
                var fresh = makePeak(-0.02);
                m.z = fresh.z;
                m.x = fresh.x;
                m.h = fresh.h;
                m.w = fresh.w;
                m.lean = fresh.lean;
              }
              var z = Math.max(0, m.z);
              var baseY = horizon + Math.pow(z, 0.82) * (h * 0.92) + bob * z;
              var cx = w * (0.5 + (m.x - 0.5) * (0.42 + z * 1.7));
              var peakH = h * (0.42 * m.h) * (0.78 + z * 0.55);
              var half = w * m.w * (0.42 + z * 0.7);
              var tipX = cx + half * m.lean;
              var tipY = baseY - peakH;
              var col = mix(z);
              ctx.beginPath();
              ctx.moveTo(tipX, tipY);
              ctx.lineTo(cx + half, baseY + 30);
              ctx.lineTo(cx - half, baseY + 30);
              ctx.closePath();
              ctx.fillStyle = "rgb(" + col[0] + "," + col[1] + "," + col[2] + ")";
              ctx.fill();
              ctx.beginPath();
              ctx.moveTo(tipX, tipY);
              ctx.lineTo(cx - half * 0.04, baseY + 30);
              ctx.lineTo(cx - half, baseY + 30);
              ctx.closePath();
              ctx.fillStyle = "rgba(255,255,255,0.16)";
              ctx.fill();
              if (z < 0.32) {
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(tipX + half * 0.07, tipY + peakH * 0.07);
                ctx.lineTo(tipX - half * 0.07, tipY + peakH * 0.07);
                ctx.closePath();
                ctx.fillStyle = "rgba(255,248,238,0.9)";
                ctx.fill();
              }
            }
            for (var k = 0; k < gusts.length; k++) {
              var s = gusts[k];
              var rush = 0.35 + s.y;
              s.x += dt * s.v * rush;
              s.y += dt * 0.045 * rush;
              if (s.x > 1.3 || s.y > 1.08) {
                var born = makeGust();
                s.x = -0.25;
                s.y = born.y * 0.72;
                s.len = born.len;
                s.v = born.v;
                s.a = born.a;
              }
              var sy = s.y * h + bob * 0.3;
              var sx = s.x * w;
              var len = s.len * (0.7 + s.y * 0.8);
              ctx.strokeStyle = "rgba(255,255,255," + s.a + ")";
              ctx.lineWidth = s.y > 0.62 ? 1.6 : 1;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.lineTo(sx - len, sy - len * 0.16);
              ctx.stroke();
            }
            if (!still) requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        })();

        var retryBtn = document.getElementById("splash-retry-btn");
        if (retryBtn) {
          retryBtn.onclick = function() {
            try { sessionStorage.removeItem('zoom-boot-reload'); } catch (e) {}
            location.reload();
          };
        }
        function configureTelegramWhenReady() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready && tg.ready();
            tg.expand && tg.expand();
            try { if (tg.exitFullscreen) tg.exitFullscreen(); } catch (e) {}
            try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
            try { tg.setHeaderColor('#000000'); } catch (e) {}
            try { tg.setBackgroundColor('#000000'); } catch (e) {}
            try { tg.setBottomBarColor('#000000'); } catch (e) {}
            try {
              var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp) localStorage.setItem('zoom-start-param', sp);
            } catch (e) {}
            applySplashSubtitle();
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', configureTelegramWhenReady);
        } else {
          configureTelegramWhenReady();
        }
        window.addEventListener('load', configureTelegramWhenReady);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
