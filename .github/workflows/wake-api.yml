name: Wake the pet bot

# The API is on Render's free plan. It turns off after a quiet stretch,
# and the pet messages live inside that process, so a night with nobody
# in the app used to send nothing. This ping wakes it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API and send due pet notes
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 90 \
            "https://zoomverse-api-u7ea.onrender.com/api/healthz"
          curl --silent --show-error --max-time 90 \
            "https://zoomverse-api-u7ea.onrender.com/api/cron/pet-notes" || true
